spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}  # 你之前 docker run 设置的密码
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  ai:
    openai:
      base-url: ${AI_BASE_URL:http://47.101.159.7:29988/v1}
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: ${AI_MODEL:qwen3.8-omni-flash}
          temperature: 0.2
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          database: ${REDIS_DATABASE:0}
          connectionMinimumIdleSize: 2
          connectionPoolSize: 16
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: existing schema baseline

# 对应你文档里的 RustFS 配置
app:
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY}
    secret-key: ${APP_STORAGE_SECRET_KEY}
    bucket: ${APP_STORAGE_BUCKET:interview-guide}
    region: ${APP_STORAGE_REGION:us-east-1}
  resume:
    analysis:
      system-prompt-path: classpath:prompts/resume-analysis-system.st
      user-prompt-path: classpath:prompts/resume-analysis-user.st
  ai:
    llm:
      # 不指定 Provider 时使用的缺省值，必须是 providers 里的 key
      default-provider: qwen
      connect-timeout-seconds: 10
      read-timeout-seconds: 120
      providers:
        qwen:
          base-url: ${AI_BASE_URL:http://47.101.159.7:29988/v1}
          api-key: ${AI_API_KEY}
          model: ${AI_MODEL:qwen3.8-omni-flash}
          temperature: 0.2
        qwen-plus:
          base-url: ${AI_BASE_URL:http://47.101.159.7:29988/v1}
          api-key: ${AI_API_KEY}
          model: qwen-plus
          temperature: 0.2